name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Scan for internal identifiers
        run: |
          pattern='xddt|business\.erp|erp-api|erp_api|NIU-SHE|com\.platform|platform_erp|置换单'
          if grep -RniE "$pattern" --exclude-dir=target pom.xml bellringer-protocol bellringer-spring-boot-starter; then
            echo "::error::Internal identifier found in sources"
            exit 1
          fi
          echo "No internal identifiers found."
