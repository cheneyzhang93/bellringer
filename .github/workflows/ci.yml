name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Scan for internal identifiers
        run: |
          # 脱敏门禁：块表以 base64 存放，避免把内部标识本身写进公开仓
          pattern=$(echo 'eGRkdHxidXNpbmVzc1wuZXJwfGVycC1hcGl8ZXJwX2FwaXxOSVUtU0hFfGNvbVwucGxhdGZvcm18cGxhdGZvcm1fZXJwfOe9ruaNouWNlQ==' | base64 -d)
          if grep -RniE "$pattern" --exclude-dir=target pom.xml example.yml README.md bellringer-protocol bellringer-spring-boot-starter; then
            echo "::error::Internal identifier found in sources"
            exit 1
          fi
          echo "No internal identifiers found."
